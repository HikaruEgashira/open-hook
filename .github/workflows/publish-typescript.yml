name: Publish TypeScript SDK

on:
  push:
    tags: ["typescript-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # npm trusted publishing (OIDC) only supports GitHub-hosted runners.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm CLI 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#typescript-v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      # Authenticates via the npm trusted publisher; provenance is generated automatically.
      - run: npm publish --access public
